description: ''
game_slug: all-in-one-language-fun
gogslug: ''
humblestoreid: ''
installer_slug: all-in-one-language-fun-cd-windows-95
name: All In One Language Fun!
notes: "- Using Dosbox Pure Unleashed with a ready to use Windows 95 OSR 2.5 install\r\
  \n- Once Windows 95 has started, go to \"My Computer\", find drive E: and install the game.\r\
  \n- Press \"CTRL+F12\" to show Dosbox Pure Unleashed menu."
runner: linux
script:
  files:
  - os_img: https://lutris.nyc3.cdn.digitaloceanspaces.com/games/Windows_95/WIN95_OSR25_DBP_2Go.7z
  - dbpu_file: https://github.com/legluondunet/mlls-tools/raw/refs/heads/master/DOSBox/dosbox-pure-unleashed.tar.xz
  - dbpu_save:
      filename: All In One Language Fun.pure.zip
      url: https://github.com/legluondunet/MyLittleLutrisScripts/raw/refs/heads/master/Windows%2095/DOSBox-pure.pure.zip
  - game_cd_bin: 
      filename: SyracuseLanguageSystems-AllInOneLanguageFun-Win31Mac.bin
      url: https://archive.org/download/Syracuse_Language_System_All-in-One_Language_Fun_Win31Mac_1995/SyracuseLanguageSystems-AllInOneLanguageFun-Win31Mac.bin
  - game_cd_cue: 
      filename: SyracuseLanguageSystems-AllInOneLanguageFun-Win31Mac.cue
      url: https://archive.org/download/Syracuse_Language_System_All-in-One_Language_Fun_Win31Mac_1995/SyracuseLanguageSystems-AllInOneLanguageFun-Win31Mac.cue
  game:
    args: '"$GAMEDIR/CD/SyracuseLanguageSystems-AllInOneLanguageFun-Win31Mac.cue"'
    exe: $GAMEDIR/DOSBoxPure_x86_64
    working_dir: $GAMEDIR
  installer:
  - extract:
      dst: $GAMEDIR
      file: dbpu_file
  - extract:
      dst: $GAMEDIR/system
      src: os_img
  - merge:
      dst: $GAMEDIR/saves
      src: dbpu_save
  - merge:
      dst: $GAMEDIR/CD
      src: game_cd_bin
  - merge:
      dst: $GAMEDIR/CD
      src: game_cd_cue
