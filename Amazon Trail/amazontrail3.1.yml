description: ''
game_slug: the-amazon-trail
gogslug: ''
humblestoreid: ''
installer_slug: the-amazon-trail-cd-windows-3.1
name: The Amazon Trail
notes: "- Using Dosbox Staging with a ready to use Windows 3.1 install\r\
  \n- Once Windows 3.1 has started, in \"Main\" group click on \"File Manager\", click on \"D\" drive,\r\
  \n- and run setup."
runner: dosbox
script:
  files:
  - os_arch: https://github.com/Doranwen/LutrisFiles/raw/refs/heads/main/Windows_3.1_256.7z
  - game_cd: 
      filename: AMAZONTR.iso
      url: https://archive.org/download/amazon-trail-1999/1_AMAZONTRAIL.iso
  game:
    main_file: $GAMEDIR/dosbox.conf
  installer:
  - extract:
      dst: $GAMEDIR
      file: os_arch
  - merge:
      dst: $GAMEDIR/CD
      src: game_cd
  - execute:
      command: cd "$GAMEDIR" ; sed -i '237i imgmount d "CD/AMAZONTR.iso" -t iso' dosbox.conf
        ;
slug: the-amazon-trail-cd-windows-3.1
steamid: null
version: CD + Windows 3.1
year: 1993
